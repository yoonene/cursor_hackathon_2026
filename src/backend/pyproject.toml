[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-saju-counselor-backend"
version = "0.1.0"
description = "Backend MVP for the AI Saju Counselor hackathon project."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "pydantic>=2.7.0,<3.0.0",
  "pydantic-settings>=2.2.1,<3.0.0",
  "langgraph>=0.2.0,<1.0.0",
  "lunar-python>=1.4,<3.0",
  "PyYAML>=6.0,<7.0",
  "httpx>=0.27.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27.0",
]
demo = [
  "streamlit>=1.39,<2",
  "httpx>=0.27.0,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "integration: subprocess Uvicorn + real HTTP client",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.saju" = [
  "rules/interpretation_rules.yaml",
  "rules/signal_catalog.yaml",
]

# 로컬 개발: src/backend 에서 `uv sync` 후 `uv run uvicorn app.main:app --reload`
[tool.uv]
package = true
